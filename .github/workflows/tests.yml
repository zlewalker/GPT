name: Database checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start isolated PostgreSQL with TLS
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE votes_ci LOGIN SUPERUSER PASSWORD 'ci-only-password';"
          sudo -u postgres createdb -O votes_ci votes_ci
      - name: SQLite, migration and PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://votes_ci:ci-only-password@localhost:5432/votes_ci?sslmode=require
        run: python -m unittest discover -s tests -v
